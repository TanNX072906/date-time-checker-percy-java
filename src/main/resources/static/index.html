<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Date Time Checker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app-container">
        <button class="close-btn" id="closeBtn">X</button>

        <div class="header">
            <img src="image/Logo_Trường_Đại_học_FPT.svg.png" alt="FPT University Logo" class="logo">
        </div>

        <h1 class="title">Date Time Checker</h1>

        <div class="form-container">
            <div class="form-group">
                <label for="day">Day</label>
                <input type="text" id="day">
            </div>
            <div class="form-group">
                <label for="month">Month</label>
                <input type="text" id="month">
            </div>
            <div class="form-group">
                <label for="year">Year</label>
                <input type="text" id="year">
            </div>
        </div>

        <div class="button-group">
            <button id="clearBtn">Clear</button>
            <button id="checkBt">Check</button>
        </div>
    </div>

    <!-- Modal for messages -->
    <div id="messageModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modalTitle">Message</span>
                <span class="close-modal">&times;</span>
            </div>
            <div class="modal-body">
                <p id="modalMessage"></p>
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Buttons will be injected dynamically depending on the modal type -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
